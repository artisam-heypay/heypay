# The app at the root, plus the MIT packages extracted from it under packages/.
# Dependency overrides also live here, their home since pnpm 10.12.
packages:
  - "packages/*"
overrides:
  postcss@<8.5.23: ">=8.5.23"
  "@hono/node-server@<1.19.13": ">=1.19.13"
  # Dedupe ioredis so bullmq and the app share one copy (avoids type clash).
  ioredis: 5.11.1
  # Transitive security fixes (pnpm audit --prod), pulled in by prisma, next and
  # @stellar/stellar-sdk before they bump them themselves.
  fast-uri@<3.1.8: ">=3.1.8"
  deepmerge-ts@<8.0.0: ">=8.0.0"
  browserslist@<4.28.7: ">=4.28.7"
  mysql2@<3.23.1: ">=3.23.1"
  baseline-browser-mapping@<2.11.0: ">=2.11.0"
  smol-toml@<1.7.1: ">=1.7.1"
  axios@<1.20.0: ">=1.20.0"
  source-map-js@<1.2.2: ">=1.2.2"
  # Transitive security fixes for the dev tools (pnpm audit), pulled in by eslint,
  # typescript-eslint, @tailwindcss/postcss, jsdom and concurrently. Each stays on
  # the major its parent expects.
  "brace-expansion@<1.1.21": ^1.1.21
  "brace-expansion@>=5.0.0 <5.0.12": ^5.0.12
  js-yaml@<4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  shell-quote@<1.11.0: ^1.11.0
  undici@<7.29.1: ^7.29.1
  # The wallets kit ships a module for every wallet it knows, and HeyPay loads
  # only Freighter's. The HOT wallet SDK it would otherwise pull in brings Solana
  # and NEAR packages with open advisories (pnpm audit --prod), one of them with
  # no fixed version, so that dependency is left out.
  "@creit.tech/stellar-wallets-kit>@hot-wallet/sdk": "-"
